# Lemur Facts — project Grok config
#
# Ruflo MCP is enabled at **user** scope (~/.grok/config.toml) so tools work
# without folder-trust. Hive profile + agents + skill are project-local:
#   .claude-flow/profiles/lemurs-swarm.json
#   .grok/agents/*
#   .grok/skills/lemurs-swarm/
#
# To pin hive-specific Ruflo env only in this repo, trust the folder first
# (/hooks-trust or launch with --trust), then uncomment below. Project MCP
# with the same name replaces the user server while this folder is trusted.

# [mcp_servers.ruflo]
# command = "npx"
# args = ["-y", "ruflo@latest", "mcp", "start"]
# enabled = true
# startup_timeout_sec = 90
# tool_timeout_sec = 600
#
# [mcp_servers.ruflo.env]
# npm_config_update_notifier = "false"
# CLAUDE_FLOW_MODE = "v3"
# CLAUDE_FLOW_HOOKS_ENABLED = "true"
# CLAUDE_FLOW_TOPOLOGY = "hierarchical-mesh"
# CLAUDE_FLOW_MAX_AGENTS = "12"
# CLAUDE_FLOW_MEMORY_BACKEND = "hybrid"
